[settings]
ruby.compile = false

[tools]
bun = "1.4.3"
node = "26.10.0"
ruby = "4.0.7"
buf = "1.73.0"
"npm:rulesync" = "38.0.0"

[env]
_.path = ["{{config_root}}/bin"]

[tasks.bootstrap]
run = [
  { task = "rulesync" },
  "bun install",
  "bundle install",
]

[tasks.ios]
description = "iOS アプリを起動する"
dir = "{{config_root}}/apps/app"
run = "bun run ios"

[tasks.android]
description = "Android アプリを起動する"
dir = "{{config_root}}/apps/app"
run = "bun run android"

[tasks.web]
description = "Web の開発サーバーを起動する"
dir = "{{config_root}}/apps/web"
run = "bun run dev"

[tasks.rulesync]
run = "rulesync generate"
